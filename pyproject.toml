[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyrf-bo"
version = "1.0.0"
description = "Uncertainty quantification for random forest surrogates in Bayesian optimization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sebastian Seifert" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "pandas>=1.3",
    "pyarrow>=10",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "pyyaml>=6",
    "smac>=2.0",
    "carps>=1.0",
    "ConfigSpace>=0.7.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "ioh>=0.3",
    "autorank>=1.3",
    "scikit-posthocs>=0.7",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Real-world benchmark suites (YAHPO Gym, HPOBench) used by the BO super-sweep.
benchmarks = ["yahpo-gym>=1.0", "hpobench @ git+https://github.com/automl/HPOBench.git"]
# HyperSHAP explanation of the meta-HPO results.
explain = ["hypershap>=0.0.8"]
# Optional CUDA acceleration of the proximity and entropy computations.
gpu = ["cupy-cuda12x"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B905"]
